<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>Online Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        #chat-container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        #messages { height: 300px; border: 1px solid #ddd; overflow-y: scroll; margin-bottom: 10px; padding: 10px; }
        input, button { padding: 10px; margin: 5px 0; }
    </style>
</head>
<body>
    <div id="chat-container">
        <h2>অনলাইন চ্যাট অ্যাপ</h2>
        <div id="messages"></div>
        <input type="text" id="messageInput" placeholder="মেসেজ লিখুন..." style="width: 70%;">
        <button id="sendBtn" style="width: 25%;">পাঠান</button>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        const sendBtn = document.getElementById('sendBtn');
        const messageInput = document.getElementById('messageInput');
        const messages = document.getElementById('messages');

        sendBtn.addEventListener('click', () => {
            if(messageInput.value) {
                socket.emit('chat_message', { message: messageInput.value });
                messageInput.value = '';
            }
        });

        socket.on('receive_message', (data) => {
            const div = document.createElement('div');
            div.innerHTML = `<strong>${data.sender}:</strong> ${data.message} <span style="font-size:10px; color:gray;">(${data.time})</span>`;
            messages.appendChild(div);
            messages.scrollTop = messages.scrollHeight;
        });
    </script>
</body>
</html>
